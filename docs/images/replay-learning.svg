<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="860" viewBox="0 0 1160 860" role="img" aria-labelledby="title desc">
<title id="title">Replay and replay selection in a tiny compatible linear example</title><desc id="desc">After learning task A, current-only task-B training fits B but shifts the shared weights and loses A. Rehearsing one stored A preserves both. Later updates and total presentations are matched, but memory access differs. A separate table shows current loss and virtual loss increase selecting different examples; uniform gives each a one-third probability. All values are illustrative toy outputs, not benchmark findings.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#596f80"/></marker></defs>
<rect width="1160" height="860" fill="#f5f8fb"/>
<g font-family="DejaVu Sans, sans-serif"><text x="40" y="48" font-size="32" font-weight="700" fill="#172b3a">Why replay, and which memory?</text><text x="40" y="80" font-size="18" font-weight="400" fill="#172b3a">ILLUSTRATION ONLY · Compatible linear tasks, not image-classification evidence.</text><rect x="40" y="104" width="1080" height="110" rx="16" fill="#eaf2f8" stroke="#c9d5df"/><text x="64" y="139" font-size="23" font-weight="700" fill="#172b3a">One model, two weights. A shared exact solution exists: (1, −1).</text><text x="64" y="177" font-size="20" font-weight="400" fill="#172b3a">Task A: (1, 0) → 1      Task B: (1, 1) → 0      Learn A first: weights ≈ (1, 0).</text><path d="M580,215 L580,245" stroke="#596f80" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/><rect x="40" y="261" width="520" height="150" rx="16" fill="#ffffff" stroke="#c9d5df"/><text x="64" y="296" font-size="23" font-weight="700" fill="#172b3a">Then B only: repeat B + B</text><text x="64" y="334" font-size="19" font-weight="400" fill="#172b3a">Weights ≈ (0.500, −0.500)</text><text x="64" y="362" font-size="19" font-weight="400" fill="#172b3a">A predicts 0.500 · B predicts 0.000</text><text x="64" y="390" font-size="19" font-weight="400" fill="#172b3a">B is learned; A’s error increases.</text><rect x="600" y="261" width="520" height="150" rx="16" fill="#eef8f5" stroke="#c9d5df"/><text x="624" y="296" font-size="23" font-weight="700" fill="#172b3a">Then rehearse: mix B + stored A</text><text x="624" y="334" font-size="19" font-weight="400" fill="#172b3a">Weights ≈ (0.999, −0.998)</text><text x="624" y="362" font-size="19" font-weight="400" fill="#172b3a">A predicts 0.999 · B predicts 0.001</text><text x="624" y="390" font-size="19" font-weight="400" fill="#172b3a">Both tasks are retained.</text><text x="48" y="447" font-size="19" font-weight="700" fill="#172b3a">Matched: 120 later updates, 240 presentations, 2 weights. Replay also stores one old A.</text><text x="40" y="493" font-size="25" font-weight="700" fill="#172b3a">A separate scoring example: hard now ≠ threatened next</text><text x="40" y="524" font-size="18" font-weight="400" fill="#172b3a">At weights (1, 0), a virtual B-only step gives (0.75, −0.25); discard that step.</text><rect x="40" y="547" width="1080" height="213" rx="16" fill="#ffffff" stroke="#c9d5df"/><text x="64" y="581" font-size="18" font-weight="700" fill="#172b3a">Old item (input → target)</text><text x="440" y="581" font-size="18" font-weight="700" fill="#172b3a">Loss now</text><text x="635" y="581" font-size="18" font-weight="700" fill="#172b3a">Loss increase</text><text x="850" y="581" font-size="18" font-weight="700" fill="#172b3a">Selected by</text><text x="64" y="624" font-size="18" font-weight="400" fill="#172b3a">Anchor: (1, 0) → 1</text><text x="440" y="624" font-size="19" font-weight="400" fill="#172b3a">0.00000</text><text x="635" y="624" font-size="19" font-weight="400" fill="#172b3a">+0.03125</text><text x="850" y="624" font-size="18" font-weight="700" fill="#172b3a">—</text><text x="64" y="671" font-size="18" font-weight="400" fill="#172b3a">Hard: (0, 1) → −1</text><text x="440" y="671" font-size="19" font-weight="400" fill="#172b3a">0.50000</text><text x="635" y="671" font-size="19" font-weight="400" fill="#172b3a">−0.21875</text><text x="850" y="671" font-size="18" font-weight="700" fill="#172b3a">High-loss</text><text x="64" y="718" font-size="18" font-weight="400" fill="#172b3a">Easy: (2, 0) → 2</text><text x="440" y="718" font-size="19" font-weight="400" fill="#172b3a">0.00000</text><text x="635" y="718" font-size="19" font-weight="400" fill="#172b3a">+0.12500</text><text x="850" y="718" font-size="18" font-weight="700" fill="#172b3a">Predicted harm</text><text x="40" y="799" font-size="18" font-weight="400" fill="#172b3a">Uniform: 1/3 chance per eligible item. These scores illustrate different questions, not a winner.</text><text x="40" y="832" font-size="17" font-weight="400" fill="#172b3a">Loss = half squared error. No class quotas, learned priorities, biology or benchmark inference.</text></g></svg>
