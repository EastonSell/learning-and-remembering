[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofunctional-lab"
version = "0.1.0"
description = "CPU-scale causal intervention experiments for functionally structured neural modules"
requires-python = ">=3.11"
dependencies = ["numpy==2.3.5"]
license = {text = "MIT"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
